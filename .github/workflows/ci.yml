name: CI

# 触发条件：
# - 推送到 main 或推送任意 v* 标签；
# - 针对 main 的 Pull Request；
# - 手动触发（workflow_dispatch）。
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支/标签的新流水线会取消尚未完成的旧流水线，节省 runner 时间。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 第一档：三个纯 JVM 模块的单元测试。
  # 用矩阵拆分，失败时能直接看出是 core / data / feature 哪一层出问题。
  # ---------------------------------------------------------------------------
  jvm-tests:
    name: JVM 测试 (${{ matrix.module }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        module: [ core, data, feature ]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 运行 :${{ matrix.module }}:jvmTest
        run: ./gradlew :${{ matrix.module }}:jvmTest --console=plain --stacktrace

      - name: 上传测试报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/reports/tests/jvmTest
            ${{ matrix.module }}/build/test-results/jvmTest
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 第二档：Android 调试包。macOS runner 预装 Android SDK，若缺少 compileSdk 36
  # 由 AGP 自动下载（setup-android 保证 licenses 已接受）。
  # ---------------------------------------------------------------------------
  android-build:
    name: Android 调试包
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 :composeApp:assembleDebug
        run: ./gradlew :composeApp:assembleDebug --console=plain --stacktrace

      - name: 上传调试包
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 第三档：iOS 模拟器（Apple Silicon）Framework 链接。
  # macos-14 为 Apple Silicon，自带 Xcode，可直接产出 iosSimulatorArm64 静态库。
  # ---------------------------------------------------------------------------
  ios-framework:
    name: iOS 模拟器 Framework
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 链接 :composeApp:linkDebugFrameworkIosSimulatorArm64
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --console=plain --stacktrace

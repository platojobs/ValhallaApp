name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-check:
    name: 版本一致性
    # composeApp 是 Android 工程，配置阶段依赖 Android SDK；使用预装 SDK 的 macOS runner。
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: 校验 Android/iOS 版本号来源
        run: ./gradlew :composeApp:verifyVersionConsistency --stacktrace 2>&1 | tee version-check.log
      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-version-check
          path: |
            version-check.log
            build/reports/problems/**
          if-no-files-found: ignore

  jvm-tests:
    name: JVM 测试（${{ matrix.module }}）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [core, data, feature]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 运行 :${{ matrix.module }}:jvmTest
        run: ./gradlew :${{ matrix.module }}:jvmTest --stacktrace 2>&1 | tee gradle-${{ matrix.module }}.log
      - name: 上传测试报告与日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-jvm-${{ matrix.module }}
          path: |
            gradle-${{ matrix.module }}.log
            ${{ matrix.module }}/build/reports/tests/**
            ${{ matrix.module }}/build/test-results/**
          if-no-files-found: ignore

  android:
    name: Android 构建（debug + release 未签名）
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 准备 Android SDK（使用 runner 预装工具）
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          echo "sdkmanager=$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: 构建 debug
        run: ./gradlew :composeApp:assembleDebug --stacktrace 2>&1 | tee android-debug.log
      - name: 构建 release（R8，未配置签名）
        run: ./gradlew :composeApp:assembleRelease :composeApp:verifyReleaseArtifact --stacktrace 2>&1 | tee android-release.log
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: composeApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: |
            android-debug.log
            android-release.log
            composeApp/build/reports/**
          if-no-files-found: ignore

  ios:
    name: iOS Framework（模拟器 Debug）
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 链接 iosSimulatorArm64 Debug Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace 2>&1 | tee ios-framework.log
      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ios
          path: |
            ios-framework.log
            composeApp/build/reports/**
          if-no-files-found: ignore

  android-instrumented:
    name: Android 运行时验签（instrumented）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 失败即红：不设 continue-on-error，跨端运行时验证不允许静默变绿。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 启动 AVD 并运行 instrumented 测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :core:connectedDebugAndroidTest --stacktrace 2>&1 | tee android-instrumented.log
      - name: 上传测试报告（始终）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-results
          path: |
            android-instrumented.log
            core/build/outputs/androidTest-results/**
            core/build/reports/androidTests/**
          if-no-files-found: ignore
      - name: 上传 logcat（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-logcat
          path: ~/android-emulator-runner/**/logcat*.txt
          if-no-files-found: ignore

  ios-runtime-tests:
    name: iOS 模拟器运行时验签（Kotlin/Native）
    runs-on: macos-14
    timeout-minutes: 45
    # 失败即红：不设 continue-on-error。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: 运行 :core:iosSimulatorArm64Test
        run: ./gradlew :core:iosSimulatorArm64Test --stacktrace 2>&1 | tee ios-runtime.log
      - name: 上传测试报告（始终）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-results
          path: |
            ios-runtime.log
            core/build/test-results/iosSimulatorArm64Test/**
            core/build/reports/tests/iosSimulatorArm64Test/**
          if-no-files-found: ignore
